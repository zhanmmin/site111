apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: idcops
  labels:
    app.kubernetes.io/name: lumen-pass-mysql
    app.kubernetes.io/part-of: idcops
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: lumen-pass-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: idcops
  labels:
    app.kubernetes.io/name: lumen-pass-mysql
    app.kubernetes.io/part-of: idcops
spec:
  selector:
    app.kubernetes.io/name: lumen-pass-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: idcops
  labels:
    app.kubernetes.io/name: lumen-pass-mysql
    app.kubernetes.io/part-of: idcops
spec:
  serviceName: mysql-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lumen-pass-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumen-pass-mysql
        app.kubernetes.io/part-of: idcops
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: registry.nj-prod-dce.saicstack.com/public/mysql:5.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumen-pass-db
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: lumen_pass
            - name: MYSQL_USER
              value: lumen_app
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumen-pass-db
                  key: MYSQL_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: csi-cephfs-nj
        resources:
          requests:
            storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: idcops
  annotations:
    site111.github.com/source-branch: main
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/part-of: idcops
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: web-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-app
        app.kubernetes.io/part-of: idcops
    spec:
      containers:
        - name: web-app
          image: artifacth.sail-cloud.com/idcops/site111:main-REPLACE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: PORT
              value: "8787"
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: lumen_pass
            - name: MYSQL_USER
              value: lumen_app
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumen-pass-db
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_USER
              value: root
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumen-pass-db
                  key: MYSQL_ROOT_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lumen-pass-db
                  key: JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lumen-pass-db
                  key: ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: idcops
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/part-of: idcops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web-app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: web-app
  namespace: idcops
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/part-of: idcops
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: web-app.idcops.njpk-uat-a.sxc.sh
      http:
        paths:
          - path: /
            backend:
              serviceName: web-app
              servicePort: http
